/**:
  ros__parameters:
    use_sim_time: false
    output_mode: steer_throttle # launch resolves from ONNX metadata
    output_tensor_name: control
    use_fixed_throttle: false # mission e2e sets true; preserve model output shape
    fixed_throttle: 0.0
    max_throttle: 0.2
    input_timeout_s: 0.15
    image_future_tolerance_s: 0.005 # Allow up to 5ms of image timestamp lead; not extra stale time
    prediction_order_policy: observe # observe: log and keep existing behavior; drop: reject non-increasing/invalid stamps before CUDA readback
    mode_timeout_s: 0.3
    control_rate_hz: 50.0
    latency_csv_path: '' # Optional new CSV path; empty disables live metadata logging
    latency_queue_capacity: 8192 # Bounded async log queue; excess records counted and dropped
    publish_decoded_frames: false # Optional lightweight per-tensor completion header; no tensor payload
    drive_enabled: false
    head_count: 1 # resolved from export routing metadata
    routing_sha256: '' # empty preserves single-head operation
    head_timeout_s: 0.3 # steady-time receipt watchdog for section selector
