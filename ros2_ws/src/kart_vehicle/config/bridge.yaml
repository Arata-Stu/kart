/**/kart_bridge:
  ros__parameters:
    use_sim_time: false
    device: ''
    steering_scale: -1.0
    # fresh STOP中のみ動的変更可能。倍率適用後。再起動でこの値に戻る。
    steering_offset: 0.0
    initial_steering_trim: 0.0
    initial_throttle_trim: 0.0
    steering_trim_limit: 0.25
    throttle_trim_limit: 0.1
    command_timeout: 0.15
    status_timeout: 0.2
    # Optional protocol sequencer; pulse values are provisional, not ESC-calibrated.
    esc_sequencer_enabled: true
    esc_reverse_brake_command: 0.1
    esc_reverse_brake_s: 0.2
    esc_reverse_neutral_s: 0.01
    esc_brake_entry_throttle: 0.08
    esc_brake_entry_s: 0.05
    esc_max_step_gap_s: 0.1
