# System composition only; node parameters remain in each module YAML.
sensor_container: kart_sensor_container
create_sensor_container: true
sensor_container_type: multithreaded
perception_engine: ""  # Empty disables racing perception; otherwise local YOLOv8s TensorRT plan.
perception_mode: track  # detect: all detections only; track: also track the model's vehicle class.
perception_debug_image: false  # Optional bounded-rate JPEG with detection/tracking boxes.
overtake_mode: "off"  # drive only: off / shadow (candidate only) / active (owns reference_line).
lap_vgl: false  # drive only: request VGL after each verified full lap.
lap_cache_clear: false  # drive only: release Jetson host clean page cache per lap; needs host helper.
enable_evs: false
enable_foxglove: false
enable_bridge: true
e2e_drive_enabled: true  # Decoder may publish only while vehicle mode is AUTO
modes:
  environment:
    localization: false
    tracking: false
    e2e: false
  collect:
    localization: false
    tracking: false
    e2e: false
  drive:
    enable_foxglove: true
    localization: true
    tracking: true
    e2e: false
  e2e:
    localization: false
    tracking: false
    e2e: true
