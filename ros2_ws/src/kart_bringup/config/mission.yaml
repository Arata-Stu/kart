# System composition only; node parameters remain in each module YAML.
sensor_container: kart_sensor_container
create_sensor_container: true
sensor_container_type: multithreaded
perception_engine: ""  # Empty disables racing perception; otherwise local YOLOv8s TensorRT plan.
perception_mode: track  # detect: all detections only; track: also track the model's vehicle class.
enable_evs: false
enable_foxglove: false
enable_bridge: true
e2e_drive_enabled: true  # Decoder may publish only while vehicle mode is AUTO
modes:
  environment:
    localization: false
    tracking: false
    e2e: false
  collect:
    localization: false
    tracking: false
    e2e: false
  drive:
    enable_foxglove: true
    localization: true
    tracking: true
    e2e: false
  e2e:
    localization: false
    tracking: false
    e2e: true
