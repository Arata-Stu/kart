# Full parameter set from system/command_mux.yaml; sim-only settings.
# Nominal simulator tuning; do not use these gains as physical vehicle calibration.
/**/command_mux:
  ros__parameters:
    use_sim_time: true
    auto_use_teleop: false
    command_timeout: 0.15
    wall_timeout_s: 5.0  # 0 follows command_timeout, sim uses separate wall watchdog
