# lookahead_m / lookahead_mode / lookahead_low_speed_m / lookahead_high_speed_m / max_speed_mps / max_cross_track_m / goal_tolerance_m / deceleration_mps2: dynamic in fresh AUTO/MANUAL/STOP.
# Full parameter set from control/pure_pursuit.yaml; sim-only settings.
# Nominal simulator tuning; do not use these gains as physical vehicle calibration.
/**/pure_pursuit:
  ros__parameters:
    use_sim_time: true
    tracking_frame: rear_axle
    map_frame: map
    wheelbase_m: 0.257
    max_steering_rad: 0.45
    parking_lookahead_m: 0.25  # Cap only for line_type=parking
    parking_goal_tolerance_m: 0.04  # Parking endpoint stop distance
    lookahead_m: 0.35
    lookahead_mode: fixed  # fixed or speed_interpolated
    lookahead_low_speed_m: 0.8  # Lookahead at |speed| <= 1 m/s
    lookahead_high_speed_m: 2.0 # Lookahead at |speed| >= 5 m/s; linear between anchors
    max_speed_mps: 1.5  # Trial ceiling; nominal target remains 0.35 m/s
    max_cross_track_m: 1.0
    goal_tolerance_m: 0.1
    deceleration_mps2: 1.0
    pose_timeout_s: 0.2
    tf_lookup_timeout_s: 0.0  # No blocking TF wait with a potentially paused /clock
    line_timeout_s: 2.5
    localization_timeout_s: 2.5
    wall_timeout_s: 5.0  # Wall receive watchdog; 0 follows each data timeout
    control_rate_hz: 30.0
