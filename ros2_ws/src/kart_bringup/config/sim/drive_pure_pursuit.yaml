# lookahead_m / max_speed_mps / max_cross_track_m / goal_tolerance_m / deceleration_mps2: dynamic in fresh AUTO/MANUAL/STOP.
# Full parameter set from control/pure_pursuit.yaml; sim-only settings.
# Nominal simulator tuning; do not use these gains as physical vehicle calibration.
/**/pure_pursuit:
  ros__parameters:
    use_sim_time: true
    tracking_frame: rear_axle
    map_frame: map
    wheelbase_m: 0.257
    max_steering_rad: 0.45
    lookahead_m: 0.35
    max_speed_mps: 1.5  # Trial ceiling; nominal target remains 0.35 m/s
    max_cross_track_m: 1.0
    goal_tolerance_m: 0.1
    deceleration_mps2: 1.0
    pose_timeout_s: 0.2
    tf_lookup_timeout_s: 0.0  # No blocking TF wait with a potentially paused /clock
    line_timeout_s: 2.5
    localization_timeout_s: 2.5
    wall_timeout_s: 5.0  # Wall receive watchdog; 0 follows each data timeout
    control_rate_hz: 30.0
