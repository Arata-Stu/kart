/**/replay_ready:
  ros__parameters:
    use_sim_time: false  # Wall clock: playback has not started yet.
    image_topics: [/realsense/infra1/image_rect_raw, /realsense/infra2/image_rect_raw]
    imu_topic: ''  # VIO: wait for visual_slam's IMU subscription as well
    subscriber_nodes: [visual_slam, visual_global_localization]
    resume_service: /rosbag2_player/resume
    timeout_s: 120.0
    recorder_node: ''  # Optional offline recorder; wait for its subscriptions before resume
    record_topics: [/clock]  # Launch passes selected recording topics; wait for advertised topics
    lap_node: ''  # Empty disables lap readiness; offline lap VGL sets lap_manager
    lap_input_topics: [/planning/reference_line, /visual_slam/tracking/odometry, /localization/vslam/diagnostics]
    lap_status_topic: /localization/lap_status  # Require this node's publisher before resume
