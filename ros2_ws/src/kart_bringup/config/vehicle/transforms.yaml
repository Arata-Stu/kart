# kart launch configuration (not a ROS parameter file). Metres and radians.
# base_link: rear axle midpoint, x forward, y left, z up.
# null = unmeasured. Never substitute the CAD mounting holes for camera_link.
# RealSense owns camera_link -> optical frames; do not duplicate those here.
transforms:
  rear_axle:
    parent: base_link
    child: rear_axle
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
  camera_mount:
    parent: base_link
    child: camera_link
    # User-reported camera_link position (2026-10-22), not calibrated extrinsics.
    # Approx. 200 mm forward; zero lateral offset reported for camera_link.
    # Reported camera_link floor height 100 mm minus accepted axle height 33 mm.
    # Facing forward; roll/pitch remain assumed zero. Physical origin needs validation.
    xyz: [0.200, 0.0, 0.067]
    rpy: [0.0, 0.0, 0.0]
  evs_mount:
    parent: base_link
    child: event_camera
    # User-selected provisional values (2026-10-10), not measured calibration.
    # Origin: lens-axis centre on the EVS front face, not calibrated optical centre.
    # Axes: x forward, y left, z up.
    xyz: [0.2045, 0.0, 0.0705]
    rpy: [0.0, 0.0, 0.0]  # Assumed level and facing forward.
