/**/opponent_tracker:
  ros__parameters:
    use_sim_time: false
    tracking_enabled: true  # --perception-mode detect disables tracking at launch.
    tracked_class_id: "2"  # COCO car. Launch derives "0" for racing RC car / legacy opponent.
    low_score: 0.1
    association_score: 0.5
    new_track_score: 0.6
    match_threshold: 0.8
    lost_frames: 30
    reset_gap_s: 0.5
