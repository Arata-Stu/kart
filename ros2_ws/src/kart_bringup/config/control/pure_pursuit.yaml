# lookahead_m / max_speed_mps / max_cross_track_m / goal_tolerance_m / deceleration_mps2: dynamic in fresh AUTO/MANUAL/STOP.
/**/pure_pursuit:
  ros__parameters:
    use_sim_time: false
    tracking_frame: rear_axle
    map_frame: map
    wheelbase_m: 0.257  # Tamiya TT-02 standard wheelbase; verify actual chassis setting.
    max_steering_rad: 0.3839724354  # Provisional 22 deg (user estimate 22..27 deg, 2026-10-26); not measured.
    lookahead_m: 0.8
    max_speed_mps: 10.0
    max_cross_track_m: 1.0
    goal_tolerance_m: 0.1
    deceleration_mps2: 1.0
    pose_timeout_s: 0.2
    tf_lookup_timeout_s: 0.05  # Wait for exact odometry-stamp TF; sim time uses zero wait
    line_timeout_s: 2.5
    localization_timeout_s: 2.5
    wall_timeout_s: 0.0  # Wall receive watchdog; 0 follows each data timeout
    control_rate_hz: 30.0
