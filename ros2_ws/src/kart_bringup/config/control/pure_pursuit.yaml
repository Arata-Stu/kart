# lookahead_m / max_speed_mps / max_cross_track_m / goal_tolerance_m / deceleration_mps2: dynamic in fresh STOP.
/**/pure_pursuit:
  ros__parameters:
    use_sim_time: false
    tracking_frame: rear_axle
    map_frame: map
    wheelbase_m: 0.257  # Tamiya TT-02 standard wheelbase; verify actual chassis setting.
    max_steering_rad: 0.0  # Required calibration, front wheel angle, left positive.
    lookahead_m: 0.8
    max_speed_mps: 1.0
    max_cross_track_m: 1.0
    goal_tolerance_m: 0.1
    deceleration_mps2: 1.0
    pose_timeout_s: 0.2
    line_timeout_s: 2.5
    localization_timeout_s: 2.5
    wall_timeout_s: 0.0  # Wall receive watchdog; 0 follows each data timeout
    control_rate_hz: 30.0
