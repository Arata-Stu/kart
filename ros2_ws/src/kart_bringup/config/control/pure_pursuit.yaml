# lookahead_m / lookahead_mode / lookahead_low_speed_m / lookahead_high_speed_m / max_speed_mps / max_cross_track_m / goal_tolerance_m / deceleration_mps2: dynamic in fresh AUTO/MANUAL/STOP.
/**/pure_pursuit:
  ros__parameters:
    use_sim_time: false
    tracking_frame: rear_axle
    map_frame: map
    wheelbase_m: 0.257  # Tamiya TT-02 standard wheelbase; verify actual chassis setting.
    max_steering_rad: 0.3839724354  # Provisional 22 deg (user estimate 22..27 deg, 2026-10-26); not measured.
    parking_lookahead_m: 0.25  # Cap only for line_type=parking
    parking_goal_tolerance_m: 0.04  # Parking endpoint stop distance
    lateral_controller: pure_pursuit  # pure_pursuit or mpc; switch at STOP + standstill
    mpc_horizon_s: 1.0  # 20 prediction steps; .3..2 s
    mpc_tracking_weight: 10.0  # .1..100; lateral/heading tracking
    mpc_smoothness_weight: 1.0  # .1..100; steering changes
    mpc_steering_rate_rad_s: 1.5  # .1..5 rad/s; provisional actuator limit
    lookahead_m: 0.8
    lookahead_mode: speed_interpolated  # fixed or speed_interpolated
    lookahead_low_speed_m: 0.8  # Lookahead at |speed| <= 1 m/s
    lookahead_high_speed_m: 3.0 # Lookahead at |speed| >= 5 m/s; linear between anchors
    max_speed_mps: 10.0
    max_cross_track_m: 1.0
    goal_tolerance_m: 0.1
    deceleration_mps2: 1.0
    pose_timeout_s: 0.2
    tf_lookup_timeout_s: 0.05  # Wait for exact odometry-stamp TF; sim time uses zero wait
    line_timeout_s: 2.5
    localization_timeout_s: 2.5
    wall_timeout_s: 0.0  # Wall receive watchdog; 0 follows each data timeout
    control_rate_hz: 30.0
