/**/speed_controller:
  ros__parameters:
    use_sim_time: false
    tracking_frame: rear_axle
    max_steering_rad: 0.3839724354  # Same provisional 22 deg as Pure Pursuit; measure actual wheel angle.
    input_timeout_s: 0.15
    mode_timeout_s: 0.3
    max_target_speed_mps: 10.0
    wall_timeout_s: 0.0  # Wall receive watchdog; 0 follows each data timeout
    control_rate_hz: 50.0
    # Measured AUTO throttle / accepted steady-speed proxies, 2026-10-23.
    # Source: throttle_test; camera pose horizontal speed medians (not calibrated
    # rear-axle longitudinal truth). User accepted these as steady speeds.
    # Lookup and rate limits are startup-only. Below 1.41 m/s uses assumed (0,0);
    # above 4.74 m/s the FF holds 0.375 (target ceiling remains independent).
    ff_speed_mps: [1.41, 1.90, 2.27, 2.67, 3.05, 3.35, 3.69, 3.83, 4.14, 4.34, 4.63, 4.74]
    ff_throttle: [0.100, 0.125, 0.150, 0.175, 0.200, 0.225, 0.250, 0.275, 0.300, 0.325, 0.350, 0.375]
    throttle_rise_rate: 0.10  # Normalized throttle / s; provisional, not identified
    throttle_fall_rate: 0.20  # Zero target/fault/braking bypasses slew
    # Dynamic feedback gains. Provisional P correction; I/D initially disabled.
    kp: 0.02
    ki: 0.0
    kd: 0.0
    kff: 0.0  # Used only when both FF arrays are empty
    integral_limit: 0.2  # Limit on integral contribution (normalized output).
    derivative_tau_s: 0.1
    throttle_limit: 0.4  # Table maximum 0.375 plus feedback headroom
    brake_limit: 0.0  # Explicit opt-in; negative PID never means reverse.
