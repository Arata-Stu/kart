/**/speed_controller:
  ros__parameters:
    use_sim_time: false
    tracking_frame: rear_axle
    max_steering_rad: 0.0  # Must match calibrated Pure Pursuit steering range.
    input_timeout_s: 0.15
    mode_timeout_s: 0.3
    max_target_speed_mps: 1.0
    control_rate_hz: 50.0
    # Dynamic parameters. Zero gains: no drive output until explicitly tuned.
    kp: 0.0
    ki: 0.0
    kd: 0.0
    kff: 0.0
    integral_limit: 0.2  # Limit on integral contribution (normalized output).
    derivative_tau_s: 0.1
    throttle_limit: 0.2
    brake_limit: 0.0  # Explicit opt-in; negative PID never means reverse.
