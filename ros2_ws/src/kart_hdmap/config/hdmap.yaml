/**/hdmap_server:
  ros__parameters:
    tuning_enabled: false  # Optional loopback tuning endpoint, TCP 8782
    tuning_map_dir: ""  # Same bundle root used for localization
    tuning_tracking_frame: rear_axle  # Vehicle pose frame, no TF publication
    map_file: ""  # Required absolute map.json or exported hd_map.yaml
    frame_id: map  # Must match file. Never relabel or transform coordinates.
    lane_id: ""  # Empty: all markers, no selected paths
    line_type: centerline  # Initial selection; dynamically changeable via ROS parameter
    centerline_speed_mps: 0.0  # Dynamic; explicit Center speed, tuning requires STOP
    allow_speed_override: false  # Opt in to runtime uniform speed trials
    nominal_speed_limit_mps: 0.0  # Original-speed ceiling; 0: no extra ceiling
    speed_override_mps: -1.0  # -1: original speed; 0.05..1.5: replace positive speeds
    publish_rate_hz: 1.0
    line_width_m: 0.04
    label_height_m: 0.25
    use_sim_time: false
