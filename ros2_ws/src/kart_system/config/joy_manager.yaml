/**/kart_joy_manager:
  ros__parameters:
    use_sim_time: false
    steering_axis: 0
    throttle_axis: 5
    reverse_axis: 4
    bag_start_button: 4
    bag_stop_button: 5
    vgl_trigger_button: 8  # Share/Create; -1 disables
    vgl_trigger_service: /visual_localization/trigger_localization
    vgl_trigger_timeout_s: 2.0
    deadman_button: -1
    brake_button: 1
    brake_pulse_throttle: 0.08  # MANUAL circle: positive pulse, then brake=1 while held
    brake_pulse_s: 0.01         # Steady time; actual output is quantized to Joy delivery
    stop_button: 0
    manual_button: 2  # Hold for MANUAL; release requests STOP
    auto_button: 3    # Hold for AUTO; release requests STOP; both held -> STOP
    steering_trim_left_button: 15
    steering_trim_right_button: 16
    throttle_trim_up_button: 13
    throttle_trim_down_button: 14
    steering_trim_step: 0.001
    throttle_trim_step: 0.001
    deadzone: 0.08
    steering_scale: 1.0
    speed_scale: 0.3
    auto_fixed_throttle: -1.0  # -1: normal triggers; 0..speed_scale: fixed only in AUTO; steering stays manual
